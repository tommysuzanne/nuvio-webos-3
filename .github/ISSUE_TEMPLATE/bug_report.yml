name: Bug report
description: Report a reproducible issue in the webOS 3.x port.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not attach API keys, configured addon URLs, IPKs, collection exports, account backups or raw private logs.
        This is the unofficial webOS 3.x port. Include the build label and reproduce the problem before reporting it.
  - type: input
    id: device
    attributes:
      label: TV model, webOS version, FHD/UHD, firmware and build label
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and relevant settings
      description: Remove account identifiers, API keys, configured URLs and personal collection names. Never post a raw account export.
